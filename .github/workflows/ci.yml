name: 构建与测试

# 每次 push / PR 自动跑一遍：编译两条线 + 五套测试（缩放几何 / 图片格式 / 绘制 / 绘制·无万能键 / 行为）
# 只验证，不发布、不签名、不部署。
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: 取源码
        uses: actions/checkout@v4

      - name: 编译两条线 + 跑全部测试
        shell: pwsh
        run: .\tools\build.ps1 -Test
